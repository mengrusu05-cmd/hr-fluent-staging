ss jurisdictions.</p><p><b>中文翻译：</b>集体谈判安排因司法管辖区而异。</p><p><b>高频短语：</b>collective bargaining agreement · 集体谈判协议</p></details><details><summary>Labor union — 工会</summary><p><b>核心释义：</b>代表员工集体利益的组织。</p><p><b>职场英文例句：</b>HR met with the labor union representatives to discuss changes.</p><p><b>中文翻译：</b>人力资源团队与工会代表会面讨论相关变更。</p><p><b>高频短语：</b>labor union representative · 工会代表</p></details><details><summary>Employment contract — 劳动合同</summary><p><b>核心释义：</b>规定双方劳动关系主要权利义务的协议。</p><p><b>职场英文例句：</b>The employment contract must reflect applicable local law.</p><p><b>中文翻译：</b>劳动合同必须符合当地适用法律。</p><p><b>高频短语：</b>sign an employment contract · 签署劳动合同</p></details><details><summary>Fixed-term contract — 固定期限合同</summary><p><b>核心释义：</b>约定合同终止日期或期限的劳动合同。</p><p><b>职场英文例句：</b>The fixed-term contract expires at the end of December.</p><p><b>中文翻译：</b>该固定期限劳动合同将在十二月底到期。</p><p><b>高频短语：</b>renew a fixed-term contract · 续签固定期限劳动合同</p></details><details><summary>Non-compete clause — 竞业限制条款</summary><p><b>核心释义：</b>按适用法律限制特定竞争行为的约定。</p><p><b>职场英文例句：</b>Legal counsel will review the non-compete clause for enforceability.</p><p><b>中文翻译：</b>法律顾问将审查竞业限制条款是否具有可执行性。</p><p><b>高频短语：</b>non-compete agreement · 竞业限制协议</p></details><details><summary>Severance pay — 遣散费／离职经济补偿</summary><p><b>核心释义：</b>因裁员、终止雇佣等情形向离职人员支付的补偿性款项，具体条件因地区与合同而异。</p><p><b>职场英文例句：</b>Severance pay is determined by the applicable rules and agreement.</p><p><b>中文翻译：</b>离职补偿金按照适用规定和双方协议确定。</p><p><b>高频短语：</b>calculate severance pay · 计算遣散费</p></details><details><summary>Termination for cause — 因故解除</summary><p><b>核心释义：</b>因特定严重原因解除雇佣关系的情形。</p><p><b>职场英文例句：</b>Termination for cause requires careful legal and factual review.</p><p><b>中文翻译：</b>因故解雇需要谨慎进行法律及事实审查。</p><p><b>高频短语：</b>grounds for termination · 解除劳动合同的理由</p></details><details><summary>Redundancy — 岗位冗余／因岗位取消而裁撤</summary><p><b>核心释义：</b>企业因岗位或业务需求减少而裁撤职位或进行人员冗余处理的情形。</p><p><b>职场英文例句：</b>We must review local obligations before implementing redundancy measures.</p><p><b>中文翻译：</b>实施裁员措施前，我们必须审查当地的法定义务。</p><p><b>高频短语：</b>redundancy consultation · 冗员裁撤协商程序</p></details><details><summary>Layoff — 裁员／裁撤人员</summary><p><b>核心释义：</b>因业务、成本或运营变化而减少用工的安排；在不同地区 layoff 可指临时或永久性裁员。</p><p><b>职场英文例句：</b>The company announced a layoff alongside a support program.</p><p><b>中文翻译：</b>公司宣布裁员，同时推出员工支持计划。</p><p><b>高频短语：</b>layoff support · 裁员支持措施</p></details><details><summary>Exit interview — 离职访谈</summary><p><b>核心释义：</b>了解员工离职原因与改进建议。</p><p><b>职场英文例句：</b>The exit interview revealed recurring concerns about career paths.</p><p><b>中文翻译：</b>离职面谈反映出员工对职业发展路径的反复担忧。</p><p><b>高频短语：</b>conduct an exit interview · 开展离职访谈</p></details><details><summary>Employee assistance program (EAP) — 员工援助计划</summary><p><b>核心释义：</b>提供心理或生活支持资源的福利项目。</p><p><b>职场英文例句：</b>The employee assistance program offers confidential support resources.</p><p><b>中文翻译：</b>员工援助计划（EAP）提供保密的支持资源。</p><p><b>高频短语：</b>access the EAP · 使用员工援助计划（EAP）</p></details><details><summary>Occupational health and safety — 职业健康与安全</summary><p><b>核心释义：</b>预防工作场所伤害及健康风险的实践。</p><p><b>职场英文例句：</b>Occupational health and safety is part of our compliance training.</p><p><b>中文翻译：</b>职业健康与安全属于我们的合规培训内容。</p><p><b>高频短语：</b>health and safety policy · 职业健康与安全政策</p></details><details><summary>Reasonable accommodation — 合理便利安排（劳动与反歧视合规）</summary><p><b>核心释义：</b>在适用法律下，为残障、宗教需求等提供合理的工作安排调整，以支持平等就业。</p><p><b>职场英文例句：</b>HR discussed a reasonable accommodation request with the employee.</p><p><b>中文翻译：</b>人力资源部门与员工讨论了合理便利安排的申请。</p><p><b>高频短语：</b>request reasonable accommodation · 申请合理便利安排</p></details><details><summary>Employee grievance — 员工申诉</summary><p><b>核心释义：</b>员工就工作待遇或行为提出的正式关切。</p><p><b>职场英文例句：</b>The employee grievance was reviewed under the internal procedure.</p><p><b>中文翻译：</b>这起员工申诉已按内部程序进行了审查。</p><p><b>高频短语：</b>raise an employee grievance · 提出员工申诉</p></details><details><summary>Due process — 正当程序</summary><p><b>核心释义：</b>作出管理决定前确保公平、适当调查及陈述机会。</p><p><b>职场英文例句：</b>Due process is important in disciplinary matters.</p><p><b>中文翻译：</b>在纪律处分事项中，正当程序非常重要。</p><p><b>高频短语：</b>follow due process · 跟进正当程序</p></details><details><summary>Protected characteristic — 受法律保护的个人特征</summary><p><b>核心释义：</b>反歧视法规保护的特征，范围因司法辖区而异。</p><p><b>职场英文例句：</b>Policies should address discrimination based on protected characteristics.</p><p><b>中文翻译：</b>政策应明确禁止因受保护特征而产生的歧视。</p><p><b>高频短语：</b>protected characteristics under local law · 当地法律保护的个人特征</p></details><details><summary>Conflict of interest — 利益冲突</summary><p><b>核心释义：</b>个人利益可能影响职业判断或职责履行的情况。</p><p><b>职场英文例句：</b>Employees must disclose potential conflicts of interest.</p><p><b>中文翻译：</b>员工必须申报潜在的利益冲突。</p><p><b>高频短语：</b>declare a conflict of interest · 申报利益冲突</p></details><details><summary>Workplace investigation — 职场调查</summary><p><b>核心释义：</b>对员工投诉或不当行为指控进行的事实调查。</p><p><b>职场英文例句：</b>The workplace investigation should be impartial and timely.</p><p><b>中文翻译：</b>职场调查应公正且及时。</p><p><b>高频短语：</b>conduct a workplace investigation · 开展职场调查</p></details><details><summary>Collective consultation — 集体协商咨询</summary><p><b>核心释义：</b>就特定组织变动与员工代表开展的法定或约定沟通。</p><p><b>职场英文例句：</b>Collective consultation may be required before certain redundancies.</p><p><b>中文翻译：</b>实施某些裁员措施前，可能需要进行集体协商。</p><p><b>高频短语：</b>collective consultation process · 集体协商程序</p></details><details><summary>Notice of termination — 解雇通知</summary><p><b>核心释义：</b>正式告知雇佣关系终止的文件或行为。</p><p><b>职场英文例句：</b>The notice of termination must meet applicable requirements.</p><p><b>中文翻译：</b>终止雇佣通知必须符合适用要求。</p><p><b>高频短语：</b>issue a notice of termination · 发出解雇通知</p></details><details><summary>Garden leave — 离职通知期带薪免到岗（花园假）</summary><p><b>核心释义：</b>在离职通知期内，雇员仍保持雇佣关系并正常领薪及约定福利，但雇主要求其暂时不履行日常工作或不到岗。英式劳动关系中常见，常为保护保密信息、客户关系而设置。</p><p><b>职场英文例句：</b>The company placed the employee on garden leave during the notice period.</p><p><b>中文翻译：</b>公司安排该员工在离职通知期内带薪免到岗（花园假）。</p><p><b>高频短语：</b>place an employee on garden leave · 安排员工在通知期内带薪免到岗</p></details><details><summary>Workplace accommodation — 工作场所合理便利／合理调整</summary><p><b>核心释义：</b>为符合特定受保护需求的员工调整工作环境、岗位设备或时间安排的措施，受适用当地法律约束。</p><p><b>职场英文例句：</b>HR discussed workplace accommodations with the employee.</p><p><b>中文翻译：</b>人力资源部门与员工讨论了职场合理便利安排。</p><p><b>高频短语：</b>request a workplace accommodation · 申请工作场所合理便利</p></details><details><summary>Non-disclosure agreement (NDA) — 保密协议</summary><p><b>核心释义：</b>约定对特定信息承担保密义务的协议。</p><p><b>职场英文例句：</b>The employee signed a non-disclosure agreement for the project.</p><p><b>中文翻译：</b>员工为该项目签署了保密协议。</p><p><b>高频短语：</b>sign a non-disclosure agreement · 签署保密协议（NDA）</p></details><details><summary>Contract renewal — 劳动合同续签／合同续期</summary><p><b>核心释义：</b>现有劳动合同到期前，雇主与员工依适用法律协商签订后续合同的过程。</p><p><b>职场英文例句：</b>HR will initiate the contract renewal process 60 days before expiry.</p><p><b>中文翻译：</b>人力资源部门将在合同到期前60天启动续签流程。</p><p><b>高频短语：</b>initiate contract renewal · 启动劳动合同续签流程</p></details><details><summary>Employment contract renewal — 劳动合同续签</summary><p><b>核心释义：</b>对员工现有劳动合同进行续签并确认新合同期限、条件及生效日。</p><p><b>职场英文例句：</b>The employment contract renewal requires the employee&#x27;s consent.</p><p><b>中文翻译：</b>劳动合同续签需要取得员工同意。</p><p><b>高频短语：</b>complete an employment contract renewal · 完成劳动合同续签</p></details><details><summary>Contract extension — 劳动合同期限延长／合同延期</summary><p><b>核心释义：</b>延长既有劳动合同约定期限的安排；与重新签订续约合同的法律效果可能不同。</p><p><b>职场英文例句：</b>The parties agreed to a three-month contract extension.</p><p><b>中文翻译：</b>双方同意将合同延长三个月。</p><p><b>高频短语：</b>agree to a contract extension · 同意延长劳动合同期限</p></details><details><summary>Contract expiration — 劳动合同到期／合同期满</summary><p><b>核心释义：</b>合同约定期限届满的状态，需要按政策及当地法律处理续签或终止。</p><p><b>职场英文例句：</b>The system will alert HR before contract expiration.</p><p><b>中文翻译：</b>系统将在合同到期前提醒人力资源部门。</p><p><b>高频短语：</b>monitor contract expiration · 监控劳动合同到期</p></details><details><summary>Renewal notice — 合同续签通知</summary><p><b>核心释义：</b>雇主向员工发送的有关合同即将届满、是否续签或续签流程的正式通知。</p><p><b>职场英文例句：</b>HR sent the renewal notice to the employee last week.</p><p><b>中文翻译：</b>人力资源部门上周已向该员工发出续签通知。</p><p><b>高频短语：</b>issue a renewal notice · 发出合同续签通知</p></details><details><summary>Dismissal — 解雇／雇主解除雇佣关系</summary><p><b>核心释义：</b>雇主主动结束员工雇佣关系的行为；可能因绩效、违纪或其他适用事由发生。</p><p><b>职场英文例句：</b>The dismissal decision must follow the required procedure.</p><p><b>中文翻译：</b>解雇决定必须遵循规定程序。</p><p><b>高频短语：</b>review a dismissal decision · 审阅解雇</p></details><details><summary>Wrongful dismissal — 违法／违约解雇</summary><p><b>核心释义：</b>不符合适用法律或劳动合同要求的雇主解除雇佣行为，法律含义因法域而异。</p><p><b>职场英文例句：</b>The legal team reviewed the risk of wrongful dismissal.</p><p><b>中文翻译：</b>法务团队审查了不当解雇的法律风险。</p><p><b>高频短语：</b>wrongful dismissal claim · 违法解雇索赔</p></details><details><summary>Termination letter — 解除雇佣通知书／解除劳动合同通知书</summary><p><b>核心释义：</b>正式告知员工雇佣关系解除及相关日期、事项的书面通知。</p><p><b>职场英文例句：</b>The termination letter must state the effective date.</p><p><b>中文翻译：</b>解除雇佣关系通知书必须写明生效日期。</p><p><b>高频短语：</b>issue a termination letter · 发出解除雇佣通知书</p></details><details><summary>Mutual separation agreement — 协商解除协议／双方同意离职协议</summary><p><b>核心释义：</b>雇主与员工通过书面协议约定结束雇佣关系的条件。</p><p><b>职场英文例句：</b>Both parties signed a mutual separation agreement.</p><p><b>中文翻译：</b>双方签署了协商解除劳动关系协议。</p><p><b>高频短语：</b>sign a mutual separation agreement · 签署协商解除协议</p></details><details><summary>Severance package — 离职补偿方案／遣散待遇包</summary><p><b>核心释义：</b>因雇佣结束而约定的经济补偿、福利及其他离职安排的组合。</p><p><b>职场英文例句：</b>The severance package includes payment for unused leave where applicable.</p><p><b>中文翻译：</b>离职补偿方案在适用情况下包括未休年假的折现支付。</p><p><b>高频短语：</b>negotiate a severance package · 协商离职补偿方案</p></details><details><summary>Payment in lieu of notice (PILON) — 代通知金／以付款替代通知期</summary><p><b>核心释义：</b>在适用法律或合同允许的情况下，雇主以支付相应款项替代要求员工实际履行通知期。</p><p><b>职场英文例句：</b>The employer offered payment in lieu of notice.</p><p><b>中文翻译：</b>雇主提出以支付代通知金代替履行通知期。</p><p><b>高频短语：</b>make a payment in lieu of notice · 支付代通知金</p></details><details><summary>Non-solicitation clause — 禁止招揽条款</summary><p><b>核心释义：</b>合同中限制离职人员在约定条件下招揽前雇主员工或客户的条款。</p><p><b>职场英文例句：</b>The agreement includes a non-solicitation clause.</p><p><b>中文翻译：</b>协议中包含禁止招揽条款。</p><p><b>高频短语：</b>review a non-solicitation clause · 审阅禁止招揽条款</p></details><details><summary>Restrictive covenant — 离职后限制性约定</summary><p><b>核心释义：</b>就业合同中限制员工离职后某些活动的约定，例如竞业限制或禁止招揽。</p><p><b>职场英文例句：</b>Legal counsel reviewed the restrictive covenant before the offer.</p><p><b>中文翻译：</b>发出录用通知前，法律顾问审查了限制性约定条款。</p><p><b>高频短语：</b>enforce a restrictive covenant · 执行离职后限制性约定</p></details><details><summary>Suspension — 停职／暂停履职</summary><p><b>核心释义：</b>员工因调查、纪律或其他原因暂时停止履职的管理安排，是否带薪因当地制度而异。</p><p><b>职场英文例句：</b>The employee was placed on suspension pending investigation.</p><p><b>中文翻译：</b>该员工在调查期间被暂时停职。</p><p><b>高频短语：</b>suspension pending investigation · 调查期间停职</p></details><details><summary>Employee misconduct — 员工违纪行为／不当行为</summary><p><b>核心释义：</b>员工违反适用职业行为规范、法律或公司政策的行为。</p><p><b>职场英文例句：</b>The investigation examined the alleged employee misconduct.</p><p><b>中文翻译：</b>调查核实了关于该员工不当行为的指控。</p><p><b>高频短语：</b>investigate employee misconduct · 调查员工违纪行为</p></details><details><summary>Exit clearance — 离职交接与结算确认</summary><p><b>核心释义：</b>离职员工归还资产、完成账户移交和结算等离职手续。</p><p><b>职场英文例句：</b>Exit clearance must be completed before the last working day.</p><p><b>中文翻译：</b>员工必须在最后工作日前完成离职交接审批。</p><p><b>高频短语：</b>complete exit clearance · 完成离职交接与结算确认</p></details></details><details class="fallback-module"><summary><b>企业文化与员工体验</b> · 53条</summary><details><summary>Organizational culture — 组织文化</summary><p><b>核心释义：</b>影响员工行为的共同价值观和默认规则。</p><p><b>职场英文例句：</b>Organizational culture shapes how teams make decisions.</p><p><b>中文翻译：</b>组织文化影响团队作出决策的方式。</p><p><b>高频短语：</b>build organizational culture · 建立组织文化</p></details><details><summary>Core values — 核心价值观</summary><p><b>核心释义：</b>组织希望员工共同遵循的行为原则。</p><p><b>职场英文例句：</b>Our core values guide hiring and leadership decisions.</p><p><b>中文翻译：</b>我们的核心价值观指导招聘和领导决策。</p><p><b>高频短语：</b>live our core values · 践行企业核心价值观</p></details><details><summary>Company mission — 企业使命</summary><p><b>核心释义：</b>组织存在的目的和服务对象。</p><p><b>职场英文例句：</b>The company mission explains why our work matters.</p><p><b>中文翻译：</b>公司使命说明了我们的工作为什么重要。</p><p><b>高频短语：</b>communicate the company mission · 沟通企业使命</p></details><details><summary>Company vision — 企业愿景</summary><p><b>核心释义：</b>组织希望实现的长期未来状态。</p><p><b>职场英文例句：</b>Our company vision helps employees see the bigger picture.</p><p><b>中文翻译：</b>公司的愿景帮助员工理解更宏观的发展方向。</p><p><b>高频短语：</b>share the company vision · 分享企业愿景</p></details><details><summary>Cultural fit — 文化匹配</summary><p><b>核心释义：</b>个人与现有文化的相似度，评估时需避免主观偏见。</p><p><b>职场英文例句：</b>We should not use cultural fit as a vague reason to reject candidates.</p><p><b>中文翻译：</b>我们不应以含糊的“文化契合度”为由拒绝候选人。</p><p><b>高频短语：</b>avoid cultural fit bias · 避免文化匹配偏见</p></details><details><summary>Culture add — 文化增益</summary><p><b>核心释义：</b>候选人为团队带来新的互补视角与价值。</p><p><b>职场英文例句：</b>We assess culture add by exploring diverse experiences and ideas.</p><p><b>中文翻译：</b>我们通过考察多样化的经历和观点来评价候选人能带来的文化增益。</p><p><b>高频短语：</b>hire for culture add · 招聘有助于文化多样性的候选人</p></details><details><summary>Employee engagement — 员工敬业度</summary><p><b>核心释义：</b>员工对工作的投入、承诺与联结程度。</p><p><b>职场英文例句：</b>Employee engagement improved after managers acted on survey feedback.</p><p><b>中文翻译：</b>管理者根据敬业度调查反馈采取行动后，员工敬业度提高了。</p><p><b>高频短语：</b>increase employee engagement · 提升员工敬业度</p></details><details><summary>Employee experience (EX) — 员工体验</summary><p><b>核心释义：</b>员工从入职到离职的整体工作感受。</p><p><b>职场英文例句：</b>Employee experience includes every major moment in the employee journey.</p><p><b>中文翻译：</b>员工体验涵盖员工职业旅程中的每一个重要时刻。</p><p><b>高频短语：</b>design employee experience · 设计员工体验</p></details><details><summary>Employee value proposition (EVP) — 雇主价值主张</summary><p><b>核心释义：</b>组织向员工提供的独特工作价值组合。</p><p><b>职场英文例句：</b>Our employee value proposition emphasizes growth and flexibility.</p><p><b>中文翻译：</b>我们的员工价值主张突出成长机会和灵活性。</p><p><b>高频短语：</b>refresh the EVP · 更新雇主价值主张（EVP）</p></details><details><summary>Psychological safety — 心理安全感</summary><p><b>核心释义：</b>成员敢于提出问题、承认错误而不担忧被羞辱。</p><p><b>职场英文例句：</b>Psychological safety encourages people to speak up early.</p><p><b>中文翻译：</b>心理安全感鼓励员工及早表达意见。</p><p><b>高频短语：</b>create psychological safety · 制定心理安全感</p></details><details><summary>Belonging — 归属感</summary><p><b>核心释义：</b>员工感到被尊重、接纳且是团队一部分。</p><p><b>职场英文例句：</b>A sense of belonging helps new hires settle in.</p><p><b>中文翻译：</b>归属感有助于新员工融入团队。</p><p><b>高频短语：</b>foster belonging · 营造归属感</p></details><details><summary>Inclusion — 包容</summary><p><b>核心释义：</b>确保不同背景的员工拥有公平参与机会。</p><p><b>职场英文例句：</b>Inclusion means everyone&#x27;s ideas can be heard.</p><p><b>中文翻译：</b>包容性意味着每个人的想法都有被倾听的机会。</p><p><b>高频短语：</b>inclusive behavior · 包容性行为</p></details><details><summary>Diversity, equity and inclusion (DEI) — 多元、公平与包容</summary><p><b>核心释义：</b>围绕差异、机会公平和参与感的实践。</p><p><b>职场英文例句：</b>Our diversity, equity and inclusion initiatives focus on fair processes.</p><p><b>中文翻译：</b>我们的多元、公平与包容举措聚焦于公平的流程。</p><p><b>高频短语：</b>DEI initiatives · 多元、公平与包容举措</p></details><details><summary>Employee resource group (ERG) — 员工资源社群</summary><p><b>核心释义：</b>由员工参与的内部支持与交流网络。</p><p><b>职场英文例句：</b>The employee resource group hosts mentoring events.</p><p><b>中文翻译：</b>员工资源小组会举办导师交流活动。</p><p><b>高频短语：</b>launch an ERG · 成立员工资源社群（ERG）</p></details><details><summary>Pulse survey — 脉搏调查</summary><p><b>核心释义：</b>高频短问卷，快速了解员工状态。</p><p><b>职场英文例句：</b>We run a pulse survey after each major organizational change.</p><p><b>中文翻译：</b>每次重大组织变革后，我们都会开展一次脉搏调查。</p><p><b>高频短语：</b>monthly pulse survey · 每月员工脉搏调查</p></details><details><summary>Engagement survey — 敬业度调查</summary><p><b>核心释义：</b>系统收集员工对工作环境的反馈。</p><p><b>职场英文例句：</b>The engagement survey showed a need for better career conversations.</p><p><b>中文翻译：</b>员工敬业度调查显示，需要开展更好的职业发展沟通。</p><p><b>高频短语：</b>analyze engagement survey results · 分析敬业度调查</p></details><details><summary>Employee Net Promoter Score (eNPS) — 员工净推荐值</summary><p><b>核心释义：</b>衡量员工向他人推荐雇主意愿的指标。</p><p><b>职场英文例句：</b>The employee Net Promoter Score improved in the latest survey.</p><p><b>中文翻译：</b>最新调查中的员工净推荐值（eNPS）有所提高。</p><p><b>高频短语：</b>track eNPS · 跟踪员工净推荐值（eNPS）</p></details><details><summary>Employee recognition — 员工认可</summary><p><b>核心释义：</b>对贡献和符合价值观的行为给予肯定。</p><p><b>职场英文例句：</b>Our employee recognition program celebrates cross-team support.</p><p><b>中文翻译：</b>我们的员工认可计划表彰跨团队协作和支持。</p><p><b>高频短语：</b>employee recognition program · 员工认可与表彰计划</p></details><details><summary>Leadership communication — 领导层沟通</summary><p><b>核心释义：</b>管理层向员工传递方向和决策的信息交流。</p><p><b>职场英文例句：</b>Leadership communication should explain both the decision and the rationale.</p><p><b>中文翻译：</b>领导层沟通既要说明决策，也要解释决策依据。</p><p><b>高频短语：</b>improve leadership communication · 改善领导层沟通</p></details><details><summary>Town hall meeting — 全员交流会</summary><p><b>核心释义：</b>领导层与员工集中沟通的互动场合。</p><p><b>职场英文例句：</b>The CEO will answer questions at the town hall meeting.</p><p><b>中文翻译：</b>首席执行官将在全员沟通会上回答问题。</p><p><b>高频短语：</b>host a town hall meeting · 主持全员交流会</p></details><details><summary>All-hands meeting — 全体员工会议</summary><p><b>核心释义：</b>面向公司或团队成员的整体会议。</p><p><b>职场英文例句：</b>The all-hands meeting will cover our quarterly priorities.</p><p><b>中文翻译：</b>全员会议将讨论本季度的重点工作。</p><p><b>高频短语：</b>quarterly all-hands meeting · 季度全员大会</p></details><details><summary>Feedback culture — 反馈文化</summary><p><b>核心释义：</b>鼓励及时、具体且相互尊重的反馈氛围。</p><p><b>职场英文例句：</b>A strong feedback culture makes coaching part of daily work.</p><p><b>中文翻译：</b>良好的反馈文化使辅导成为日常工作的一部分。</p><p><b>高频短语：</b>build a feedback culture · 建立反馈文化</p></details><details><summary>Speak-up culture — 敢言文化</summary><p><b>核心释义：</b>鼓励员工安全地提出不同意见和问题。</p><p><b>职场英文例句：</b>A speak-up culture depends on how leaders respond to concerns.</p><p><b>中文翻译：</b>鼓励员工发声的文化取决于领导者如何回应员工关切。</p><p><b>高频短语：</b>encourage a speak-up culture · 鼓励敢言文化</p></details><details><summary>Cross-functional collaboration — 跨职能协作</summary><p><b>核心释义：</b>不同部门共同解决问题并交付成果。</p><p><b>职场英文例句：</b>Cross-functional collaboration is critical for the product launch.</p><p><b>中文翻译：</b>跨职能协作对产品发布至关重要。</p><p><b>高频短语：</b>enable cross-functional collaboration · 促进跨职能协作</p></details><details><summary>Team norms — 团队协作规范</summary><p><b>核心释义：</b>约定沟通、会议与决策的共同规则。</p><p><b>职场英文例句：</b>We agreed on team norms for hybrid meetings.</p><p><b>中文翻译：</b>我们就混合办公会议的团队规范达成了共识。</p><p><b>高频短语：</b>set team norms · 设定团队协作规范</p></details><details><summary>Hybrid work — 混合办公</summary><p><b>核心释义：</b>结合远程和现场工作的工作安排。</p><p><b>职场英文例句：</b>Our hybrid work policy sets expectations for team collaboration.</p><p><b>中文翻译：</b>我们的混合办公政策明确了团队协作的期望。</p><p><b>高频短语：</b>hybrid work arrangement · 混合办公安排</p></details><details><summary>Remote work policy — 远程办公政策</summary><p><b>核心释义：</b>明确远程工作的资格与管理要求。</p><p><b>职场英文例句：</b>The remote work policy covers equipment and information security.</p><p><b>中文翻译：</b>远程办公政策涵盖设备和信息安全要求。</p><p><b>高频短语：</b>review remote work policy · 审阅远程办公政策</p></details><details><summary>Work-life balance — 工作生活平衡</summary><p><b>核心释义：</b>在职业职责与私人生活间实现可持续安排。</p><p><b>职场英文例句：</b>Flexible schedules can support work-life balance.</p><p><b>中文翻译：</b>灵活的工作时间安排有助于实现工作与生活平衡。</p><p><b>高频短语：</b>promote work-life balance · 推动工作生活平衡</p></details><details><summary>Employee wellbeing — 员工身心健康</summary><p><b>核心释义：</b>关注员工健康与可持续工作状态。</p><p><b>职场英文例句：</b>Employee wellbeing requires both resources and manageable workloads.</p><p><b>中文翻译：</b>员工身心健康既需要支持资源，也需要合理的工作负荷。</p><p><b>高频短语：</b>employee wellbeing initiatives · 员工身心健康举措</p></details><details><summary>Change communication — 变革沟通</summary><p><b>核心释义：</b>围绕组织调整解释原因、影响和下一步。</p><p><b>职场英文例句：</b>Change communication should address employee questions honestly.</p><p><b>中文翻译：</b>变革沟通应坦诚回应员工的疑问。</p><p><b>高频短语：</b>change communication plan · 变革沟通计划</p></details><details><summary>Employee listening — 员工心声收集</summary><p><b>核心释义：</b>持续收集和回应员工体验与意见的实践。</p><p><b>职场英文例句：</b>Employee listening should lead to visible actions.</p><p><b>中文翻译：</b>倾听员工意见应当转化为看得见的行动。</p><p><b>高频短语：</b>employee listening strategy · 员工心声收集策略</p></details><details><summary>Culture survey — 文化调查</summary><p><b>核心释义：</b>了解员工对组织价值观和行为实践的感知。</p><p><b>职场英文例句：</b>The culture survey revealed gaps between stated values and daily behavior.</p><p><b>中文翻译：</b>文化调查发现，公司倡导的价值观与日常行为之间存在差距。</p><p><b>高频短语：</b>run a culture survey · 开展文化调查</p></details><details><summary>Inclusion index — 包容性指数</summary><p><b>核心释义：</b>根据问卷等指标衡量员工的包容体验。</p><p><b>职场英文例句：</b>The inclusion index improved in the latest employee survey.</p><p><b>中文翻译：</b>最新员工调查中的包容性指数有所提高。</p><p><b>高频短语：</b>track the inclusion index · 跟踪包容性指数</p></details><details><summary>Employee journey map — 员工旅程地图</summary><p><b>核心释义：</b>梳理员工关键接触点及体验的工具。</p><p><b>职场英文例句：</b>The employee journey map highlights pain points during onboarding.</p><p><b>中文翻译：</b>员工旅程地图突出了入职环节的体验痛点。</p><p><b>高频短语：</b>create an employee journey map · 制定员工旅程地图</p></details><details><summary>Moments that matter — 关键体验时刻</summary><p><b>核心释义：</b>显著影响员工感受的重要事件节点。</p><p><b>职场英文例句：</b>We focused on moments that matter such as joining and promotion.</p><p><b>中文翻译：</b>我们聚焦入职、晋升等对员工而言的重要时刻。</p><p><b>高频短语：</b>moments that matter in the employee journey · 员工旅程中的关键体验时刻</p></details><details><summary>Workplace flexibility — 工作灵活性</summary><p><b>核心释义：</b>对工作时间、地点或方式作出的灵活安排。</p><p><b>职场英文例句：</b>Workplace flexibility can improve access to talent.</p><p><b>中文翻译：</b>灵活的工作安排有助于吸引更多人才。</p><p><b>高频短语：</b>workplace flexibility options · 灵活工作安排选项</p></details><details><summary>Burnout prevention — 职业倦怠预防</summary><p><b>核心释义：</b>减少长期工作压力与过载风险的管理措施。</p><p><b>职场英文例句：</b>Burnout prevention requires changes to workload and management practices.</p><p><b>中文翻译：</b>预防职业倦怠需要调整工作量和管理方式。</p><p><b>高频短语：</b>burnout prevention measures · 职业倦怠预防措施</p></details><details><summary>Employee advocacy — 员工倡导</summary><p><b>核心释义：</b>员工自愿向外界分享真实雇主体验和观点。</p><p><b>职场英文例句：</b>Employee advocacy supports authentic employer branding.</p><p><b>中文翻译：</b>员工自发代言有助于塑造真实可信的雇主品牌。</p><p><b>高频短语：</b>employee advocacy program · 员工倡导计划</p></details><details><summary>Recognition platform — 认可平台</summary><p><b>核心释义：</b>用于同事互相表扬或记录贡献的工具。</p><p><b>职场英文例句：</b>The recognition platform makes peer appreciation more visible.</p><p><b>中文翻译：</b>员工认可平台让同事之间的感谢更加可见。</p><p><b>高频短语：</b>launch a recognition platform · 启动认可平台</p></details><details><summary>Culture transformation — 文化转型</summary><p><b>核心释义：</b>通过制度、行为和领导方式改变组织文化的过程。</p><p><b>职场英文例句：</b>Culture transformation depends on sustained leadership action.</p><p><b>中文翻译：</b>文化转型依赖领导层持续采取行动。</p><p><b>高频短语：</b>culture transformation roadmap · 文化转型路线图</p></details><details><summary>Employer brand — 雇主品牌（雇主形象）</summary><p><b>核心释义：</b>求职者、员工与社会公众对企业作为雇主的整体认知和评价。</p><p><b>职场英文例句：</b>Our employer brand is strongest among early-career talent.</p><p><b>中文翻译：</b>在初入职场的人才群体中，我们的雇主品牌最具吸引力。</p><p><b>高频短语：</b>strengthen the employer brand · 加强雇主品牌</p></details><details><summary>Employee satisfaction — 员工满意度</summary><p><b>核心释义：</b>员工对工作环境、管理方式、薪酬和整体就业体验的主观满意程度。</p><p><b>职场英文例句：</b>The employee satisfaction score improved this quarter.</p><p><b>中文翻译：</b>本季度员工满意度得分有所提升。</p><p><b>高频短语：</b>measure employee satisfaction · 衡量员工满意度</p></details><details><summary>Stay interview — 留任访谈</summary><p><b>核心释义：</b>雇主主动与在职员工沟通其留任动机、风险与改善需求的访谈。</p><p><b>职场英文例句：</b>Managers will conduct stay interviews with key employees.</p><p><b>中文翻译：</b>管理者将与关键员工开展留任访谈。</p><p><b>高频短语：</b>conduct a stay interview · 开展留任访谈</p></details><details><summary>Employee feedback channel — 员工意见反馈渠道</summary><p><b>核心释义：</b>员工可向组织表达建议、问题或关切的正式渠道。</p><p><b>职场英文例句：</b>We launched an anonymous employee feedback channel.</p><p><b>中文翻译：</b>我们开通了匿名员工反馈渠道。</p><p><b>高频短语：</b>open an employee feedback channel · 开通员工意见反馈渠道</p></details><details><summary>Employer reputation — 雇主声誉</summary><p><b>核心释义：</b>外部劳动力市场及社会对企业雇佣实践和员工待遇的评价。</p><p><b>职场英文例句：</b>Employer reputation influences application rates.</p><p><b>中文翻译：</b>雇主声誉会影响应聘申请率。</p><p><b>高频短语：</b>protect employer reputation · 保护雇主声誉</p></details><details><summary>New hire experience — 新员工入职体验</summary><p><b>核心释义：</b>员工从录用到融入团队期间，对手续、培训、支持和文化的整体感受。</p><p><b>职场英文例句：</b>The survey tracks new hire experience in the first 90 days.</p><p><b>中文翻译：</b>该调查跟踪新员工入职前90天的体验。</p><p><b>高频短语：</b>improve new hire experience · 改善新员工入职体验</p></details><details><summary>Employee volunteering — 员工志愿服务</summary><p><b>核心释义：</b>企业组织或支持员工自愿参加公益与社区服务的活动。</p><p><b>职场英文例句：</b>Employee volunteering is part of our community program.</p><p><b>中文翻译：</b>员工志愿服务是公司社区项目的一部分。</p><p><b>高频短语：</b>promote employee volunteering · 推动员工志愿服务</p></details><details><summary>Recognition program — 员工表彰激励计划</summary><p><b>核心释义：</b>鼓励和表彰员工贡献、价值观行为及团队成就的制度化项目。</p><p><b>职场英文例句：</b>The recognition program rewards cross-team collaboration.</p><p><b>中文翻译：</b>员工认可计划奖励跨团队协作。</p><p><b>高频短语：</b>launch a recognition program · 启动员工表彰激励计划</p></details><details><summary>Employee sentiment — 员工情绪与态度倾向</summary><p><b>核心释义：</b>根据调研或员工反馈观察员工对工作和组织的总体感受。</p><p><b>职场英文例句：</b>Employee sentiment became more positive after the policy update.</p><p><b>中文翻译：</b>政策更新后，员工整体情绪更加积极。</p><p><b>高频短语：</b>track employee sentiment · 跟踪员工情绪与态度倾向</p></details><details><summary>Workplace climate — 职场氛围／工作环境感受</summary><p><b>核心释义：</b>员工对团队互动、领导方式及日常工作环境的集体体验。</p><p><b>职场英文例句：</b>The survey assesses workplace climate across teams.</p><p><b>中文翻译：</b>调查评估了不同团队的职场氛围。</p><p><b>高频短语：</b>improve workplace climate · 改善职场氛围</p></details><details><summary>Employee voice — 员工发声权／员工意见表达</summary><p><b>核心释义：</b>员工能否表达观点、提出关切并在决策中被倾听的机制与体验。</p><p><b>职场英文例句：</b>Employee voice is a key part of an inclusive culture.</p><p><b>中文翻译：</b>员工发声是包容性文化的重要组成部分。</p><p><b>高频短语：</b>strengthen employee voice · 加强员工发声权</p></details><details><summary>Culture fit interview — 文化契合度面试</summary><p><b>核心释义：</b>通过行为问题了解候选人价值观与组织工作方式的匹配情况，应避免主观偏见。</p><p><b>职场英文例句：</b>A culture fit interview should use fair and consistent criteria.</p><p><b>中文翻译：</b>文化契合度面试应采用公平且一致的标准。</p><p><b>高频短语：</b>design a culture fit interview · 设计文化契合度面试</p></details><details><summary>Wellbeing program — 员工身心健康支持计划</summary><p><b>核心释义：</b>为员工身心健康、压力管理和工作生活平衡提供的企业项目。</p><p><b>职场英文例句：</b>The wellbeing program includes confidential counseling support.</p><p><b>中文翻译：</b>员工身心健康计划包括保密心理咨询支持。</p><p><b>高频短语：</b>offer a wellbeing program · 提供员工身心健康支持计划</p></details></details><details class="fallback-module"><summary><b>HR运营与数据分析</b> · 53条</summary><details><summary>Human resources information system (HRIS) — 人力资源信息系统</summary><p><b>核心释义：</b>集中管理员工数据与HR流程的平台。</p><p><b>职场英文例句：</b>The human resources information system stores employee records.</p><p><b>中文翻译：</b>人力资源信息系统（HRIS）保存员工档案。</p><p><b>高频短语：</b>HRIS implementation · 实施人力资源信息系统（HRIS）</p></details><details><summary>Human capital management (HCM) — 人力资本管理</summary><p><b>核心释义：</b>覆盖招聘、用工、绩效等人才管理的体系。</p><p><b>职场英文例句：</b>Our human capital management platform supports global HR processes.</p><p><b>中文翻译：</b>我们的人力资本管理（HCM）平台支持全球人力资源流程。</p><p><b>高频短语：</b>HCM platform · 人力资本管理平台</p></details><details><summary>Employee master data — 员工主数据</summary><p><b>核心释义：</b>用于HR系统的核心员工基础信息。</p><p><b>职场英文例句：</b>Please verify employee master data before payroll closes.</p><p><b>中文翻译：</b>薪资核算截止前，请核对员工主数据。</p><p><b>高频短语：</b>maintain employee master data · 保持员工主数据</p></details><details><summary>Personnel file — 员工人事档案</summary><p><b>核心释义：</b>保存与雇佣关系有关的授权记录。</p><p><b>职场英文例句：</b>Access to a personnel file is restricted to authorized staff.</p><p><b>中文翻译：</b>只有获得授权的人员才能访问人事档案。</p><p><b>高频短语：</b>review a personnel file · 审阅员工人事档案</p></details><details><summary>Employee lifecycle — 员工全生命周期</summary><p><b>核心释义：</b>员工从招聘到离职的完整管理过程。</p><p><b>职场英文例句：</b>We mapped the employee lifecycle to find service gaps.</p><p><b>中文翻译：</b>我们梳理了员工全生命周期，以识别人力资源服务中的缺口。</p><p><b>高频短语：</b>employee lifecycle journey · 员工全生命周期历程</p></details><details><summary>HR shared services — 人力共享服务</summary><p><b>核心释义：</b>集中提供标准化HR事务服务的模式。</p><p><b>职场英文例句：</b>HR shared services handles routine employee questions.</p><p><b>中文翻译：</b>人力资源共享服务中心负责处理员工的日常问题。</p><p><b>高频短语：</b>HR shared services center · 人力资源共享服务中心</p></details><details><summary>Service level agreement (SLA) — 服务级别协议</summary><p><b>核心释义：</b>规定服务范围、响应时间和质量标准。</p><p><b>职场英文例句：</b>Our service level agreement sets a two-day response target.</p><p><b>中文翻译：</b>我们的服务水平协议规定了两个工作日的响应目标。</p><p><b>高频短语：</b>meet an SLA · 达到服务级别协议要求（SLA）</p></details><details><summary>Case management — 工单管理</summary><p><b>核心释义：</b>记录、分派和跟进员工服务请求的流程。</p><p><b>职场英文例句：</b>Case management helps us track complex HR requests.</p><p><b>中文翻译：</b>人力资源个案管理有助于追踪复杂的员工请求。</p><p><b>高频短语：</b>HR case management · 人力资源工单管理</p></details><details><summary>Employee self-service (ESS) — 员工自助服务</summary><p><b>核心释义：</b>员工自行查工资条、请假等的功能。</p><p><b>职场英文例句：</b>Employee self-service reduces routine HR tickets.</p><p><b>中文翻译：</b>员工自助服务减少了常规人力资源工单。</p><p><b>高频短语：</b>ESS portal · 员工自助服务门户（ESS）</p></details><details><summary>Manager self-service (MSS) — 经理自助服务</summary><p><b>核心释义：</b>经理直接提交或审批相关HR事项的功能。</p><p><b>职场英文例句：</b>Manager self-service lets leaders approve team requests.</p><p><b>中文翻译：</b>经理自助服务让管理者能够审批团队申请。</p><p><b>高频短语：</b>MSS dashboard · 经理自助服务仪表板（MSS）</p></details><details><summary>Attendance tracking — 出勤管理</summary><p><b>核心释义：</b>记录员工实际出勤和考勤异常。</p><p><b>职场英文例句：</b>Attendance tracking is integrated with the payroll system.</p><p><b>中文翻译：</b>考勤记录系统已与薪资系统集成。</p><p><b>高频短语：</b>attendance tracking system · 考勤跟踪系统</p></details><details><summary>Leave of absence — 长期或正式休假</summary><p><b>核心释义：</b>因特定事由暂时离岗的安排。</p><p><b>职场英文例句：</b>The employee requested a leave of absence for family reasons.</p><p><b>中文翻译：</b>该员工因家庭原因申请了休假。</p><p><b>高频短语：</b>request a leave of absence · 申请长期或正式休假</p></details><details><summary>Sick leave — 病假</summary><p><b>核心释义：</b>因疾病或健康原因按规定休假。</p><p><b>职场英文例句：</b>Please follow local policy when recording sick leave.</p><p><b>中文翻译：</b>登记病假时，请遵守当地政策。</p><p><b>高频短语：</b>sick leave entitlement · 病假权益</p></details><details><summary>Maternity leave — 产假</summary><p><b>核心释义：</b>与分娩相关的法定或公司休假安排。</p><p><b>职场英文例句：</b>Maternity leave entitlements depend on local law and policy.</p><p><b>中文翻译：</b>产假权益取决于当地法律和公司政策。</p><p><b>高频短语：</b>maternity leave policy · 产假政策</p></details><details><summary>Paternity leave — 陪产假</summary><p><b>核心释义：</b>配偶或伴侣生育时适用的休假安排。</p><p><b>职场英文例句：</b>The employee asked HR about paternity leave eligibility.</p><p><b>中文翻译：</b>该员工向人力资源部门询问陪产假申请资格。</p><p><b>高频短语：</b>paternity leave entitlement · 陪产假权益</p></details><details><summary>Shift scheduling — 排班管理</summary><p><b>核心释义：</b>规划轮班时间与人员覆盖。</p><p><b>职场英文例句：</b>Shift scheduling should account for legal rest requirements.</p><p><b>中文翻译：</b>排班时应考虑法定休息时间要求。</p><p><b>高频短语：</b>manage shift scheduling · 管理排班管理</p></details><details><summary>Time sheet — 工时表</summary><p><b>核心释义：</b>用于记录工作时间或项目投入的表格。</p><p><b>职场英文例句：</b>Please submit your time sheet before Friday.</p><p><b>中文翻译：</b>请在周五之前提交工时表。</p><p><b>高频短语：</b>approve a time sheet · 审批工时表</p></details><details><summary>Data privacy — 数据隐私</summary><p><b>核心释义：</b>规范个人信息的收集、使用及保护。</p><p><b>职场英文例句：</b>Data privacy is essential when handling employee records.</p><p><b>中文翻译：</b>处理员工档案时，保护数据隐私至关重要。</p><p><b>高频短语：</b>protect data privacy · 保护数据隐私</p></details><details><summary>Access control — 访问控制</summary><p><b>核心释义：</b>根据职责限制系统与数据权限。</p><p><b>职场英文例句：</b>Access control prevents unauthorized changes to salary data.</p><p><b>中文翻译：</b>访问控制可防止未经授权修改薪资数据。</p><p><b>高频短语：</b>role-based access control · 基于角色的访问控制</p></details><details><summary>HR audit — 人力资源审计</summary><p><b>核心释义：</b>检查制度、流程和记录是否符合要求。</p><p><b>职场英文例句：</b>The HR audit identified gaps in document retention.</p><p><b>中文翻译：</b>人力资源审计发现了文件留存方面的不足。</p><p><b>高频短语：</b>conduct an HR audit · 开展人力资源审计</p></details><details><summary>Compliance training — 合规培训</summary><p><b>核心释义：</b>帮助员工理解法规及内部要求的课程。</p><p><b>职场英文例句：</b>Compliance training is mandatory for relevant employees.</p><p><b>中文翻译：</b>相关员工必须完成合规培训。</p><p><b>高频短语：</b>complete compliance training · 完成合规培训</p></details><details><summary>Headcount report — 人员编制报告</summary><p><b>核心释义：</b>汇总在岗人数、岗位和人员变动。</p><p><b>职场英文例句：</b>The headcount report includes actuals and approved positions.</p><p><b>中文翻译：</b>人员编制报告包括实际在岗人数和已批准岗位数。</p><p><b>高频短语：</b>monthly headcount report · 每月人员编制报告</p></details><details><summary>Attrition rate — 员工流失率</summary><p><b>核心释义：</b>特定统计期内离开组织的员工相对员工规模的比例；应明确是否包含自愿及非自愿离职及所用分母。</p><p><b>职场英文例句：</b>Our employee attrition rate rose from 8% to 10% over the year.</p><p><b>中文翻译：</b>过去一年，我们的员工流失率从8%上升至10%。</p><p><b>高频短语：</b>calculate attrition rate · 计算员工流失率</p></details><details><summary>Voluntary turnover — 员工主动离职（人数／情况）</summary><p><b>核心释义：</b>员工主动提出辞职导致的人员离职。</p><p><b>职场英文例句：</b>Voluntary turnover fell after the retention initiative.</p><p><b>中文翻译：</b>实施留任举措后，员工主动离职率下降了。</p><p><b>高频短语：</b>monitor voluntary turnover · 监控员工主动离职</p></details><details><summary>Retention rate — 留任率</summary><p><b>核心释义：</b>指定期间员工继续留在组织的比例。</p><p><b>职场英文例句：</b>The retention rate is one indicator of workforce stability.</p><p><b>中文翻译：</b>员工留存率是衡量人员稳定性的指标之一。</p><p><b>高频短语：</b>improve retention rate · 改善留任率</p></details><details><summary>Absenteeism rate — 员工缺勤率</summary><p><b>核心释义：</b>指定统计期间内员工未按排班到岗的缺勤比例，需定义缺勤类型与计算分母。</p><p><b>职场英文例句：</b>The absenteeism rate should be interpreted alongside leave policies.</p><p><b>中文翻译：</b>解读缺勤率时，应结合休假政策考虑。</p><p><b>高频短语：</b>track absenteeism rate · 跟踪员工缺勤率</p></details><details><summary>Cost per hire — 单次招聘成本</summary><p><b>核心释义：</b>招聘总投入除以招聘人数的指标。</p><p><b>职场英文例句：</b>Cost per hire includes internal and external recruiting expenses.</p><p><b>中文翻译：</b>单次招聘成本包括内部和外部招聘费用。</p><p><b>高频短语：</b>reduce cost per hire · 缩短单次招聘成本</p></details><details><summary>Time to productivity — 达到岗位有效产出的时间</summary><p><b>核心释义：</b>新员工适应到能独立贡献所需的周期。</p><p><b>职场英文例句：</b>Better onboarding can shorten time to productivity.</p><p><b>中文翻译：</b>完善的入职培训可以缩短新员工达到预期生产力所需的时间。</p><p><b>高频短语：</b>measure time to productivity · 衡量达到岗位有效产出的时间</p></details><details><summary>HR dashboard — 人力资源看板</summary><p><b>核心释义：</b>集中展示关键人事指标的可视化页面。</p><p><b>职场英文例句：</b>The HR dashboard shows headcount and turnover trends.</p><p><b>中文翻译：</b>人力资源仪表盘展示人员规模和离职率趋势。</p><p><b>高频短语：</b>build an HR dashboard · 建立人力资源看板</p></details><details><summary>People analytics — 人力数据分析</summary><p><b>核心释义：</b>用员工相关数据支持更好的管理决策。</p><p><b>职场英文例句：</b>People analytics helps identify patterns, not automatic causes.</p><p><b>中文翻译：</b>人才数据分析有助于识别规律，但不能自动证明因果关系。</p><p><b>高频短语：</b>apply people analytics · 应用人力数据分析</p></details><details><summary>Full-time equivalent (FTE) — 全职当量</summary><p><b>核心释义：</b>将不同工时折算为标准全职工作量的指标。</p><p><b>职场英文例句：</b>The workforce plan assumes 120 full-time equivalents.</p><p><b>中文翻译：</b>人力规划假设需要120个全职当量（FTE）。</p><p><b>高频短语：</b>calculate full-time equivalents · 计算全职当量（FTE）</p></details><details><summary>Vacancy rate — 岗位空缺率</summary><p><b>核心释义：</b>空缺岗位占所定义岗位总数的比例，需明确口径。</p><p><b>职场英文例句：</b>The vacancy rate is highest in customer operations.</p><p><b>中文翻译：</b>客户运营部门的职位空缺率最高。</p><p><b>高频短语：</b>monitor the vacancy rate · 监控岗位空缺率</p></details><details><summary>Regrettable attrition — 关键人才或希望挽留人员的流失</summary><p><b>核心释义：</b>按企业定义识别的需关注离职。</p><p><b>职场英文例句：</b>We monitor regrettable attrition for mission-critical teams.</p><p><b>中文翻译：</b>我们监测关键业务团队中不希望发生的员工流失。</p><p><b>高频短语：</b>regrettable attrition rate · 关键人才流失率</p></details><details><summary>Data governance — 数据治理</summary><p><b>核心释义：</b>对数据质量、权限、定义及责任进行管理。</p><p><b>职场英文例句：</b>HR data governance requires clear ownership of employee records.</p><p><b>中文翻译：</b>人力资源数据治理需要明确员工数据的管理责任人。</p><p><b>高频短语：</b>HR data governance framework · 人力资源数据治理框架</p></details><details><summary>Data retention policy — 数据保留政策</summary><p><b>核心释义：</b>规定个人或业务信息保存期限及处理原则。</p><p><b>职场英文例句：</b>The data retention policy defines when old records are deleted.</p><p><b>中文翻译：</b>数据保留政策规定了何时删除旧档案。</p><p><b>高频短语：</b>data retention schedule · 数据保留期限表</p></details><details><summary>Workforce analytics — 劳动力分析</summary><p><b>核心释义：</b>分析员工结构、成本和流动趋势以支持规划。</p><p><b>职场英文例句：</b>Workforce analytics helps us forecast staffing needs.</p><p><b>中文翻译：</b>劳动力数据分析帮助我们预测人员配置需求。</p><p><b>高频短语：</b>workforce analytics model · 人力分析模型</p></details><details><summary>People metrics — 人力指标</summary><p><b>核心释义：</b>用于衡量员工和组织情况的各类指标。</p><p><b>职场英文例句：</b>We agreed on consistent definitions for our people metrics.</p><p><b>中文翻译：</b>我们就各项人力资源指标的统一定义达成了共识。</p><p><b>高频短语：</b>standardize people metrics · 标准化人力指标</p></details><details><summary>Data dictionary — 数据字典</summary><p><b>核心释义：</b>定义字段、取值及统计口径的说明文件。</p><p><b>职场英文例句：</b>The data dictionary explains how turnover is calculated.</p><p><b>中文翻译：</b>数据字典说明了员工离职率的计算方法。</p><p><b>高频短语：</b>maintain a data dictionary · 保持数据字典</p></details><details><summary>HR service ticket — HR服务工单</summary><p><b>核心释义：</b>记录并追踪员工提出的服务请求。</p><p><b>职场英文例句：</b>The HR service ticket was resolved within the agreed target.</p><p><b>中文翻译：</b>该人力资源服务工单在约定的时限内解决了。</p><p><b>高频短语：</b>resolve an HR service ticket · 解决HR服务工单</p></details><details><summary>Predictive analytics — 预测分析</summary><p><b>核心释义：</b>基于历史数据和模型估计未来可能结果。</p><p><b>职场英文例句：</b>Predictive analytics should be validated for bias and reliability.</p><p><b>中文翻译：</b>预测性分析应进行偏差与可靠性验证。</p><p><b>高频短语：</b>predictive analytics in HR · 人力资源预测分析</p></details><details><summary>Employee turnover rate — 员工离职率</summary><p><b>核心释义：</b>某统计期内离职员工占平均在职员工等约定基数的比例，需明确口径。</p><p><b>职场英文例句：</b>The employee turnover rate declined in the second quarter.</p><p><b>中文翻译：</b>第二季度员工离职率下降了。</p><p><b>高频短语：</b>calculate employee turnover rate · 计算员工离职率</p></details><details><summary>Employee ID — 员工工号</summary><p><b>核心释义：</b>用于 HRIS、考勤、薪酬和人事档案识别员工的唯一编号。</p><p><b>职场英文例句：</b>Please enter your employee ID to access the HR portal.</p><p><b>中文翻译：</b>请输入工号以访问人力资源门户。</p><p><b>高频短语：</b>verify an employee ID · 核验员工工号</p></details><details><summary>Employee status — 员工在职状态／雇佣状态</summary><p><b>核心释义：</b>HR 系统中记录员工在职、休假、离职等雇佣状态的字段。</p><p><b>职场英文例句：</b>The employee status should be updated after termination.</p><p><b>中文翻译：</b>员工离职后，应更新其雇佣状态。</p><p><b>高频短语：</b>update employee status · 更新员工在职状态</p></details><details><summary>Payroll processing — 薪资核算与发放处理</summary><p><b>核心释义：</b>按照薪资周期计算员工应发、扣款、实发并完成薪资发放的流程。</p><p><b>职场英文例句：</b>Payroll processing must be finalized before the cutoff date.</p><p><b>中文翻译：</b>必须在截止日期前完成薪资核算。</p><p><b>高频短语：</b>complete payroll processing · 完成薪资核算与发放处理</p></details><details><summary>Payroll cutoff date — 薪资核算截止日</summary><p><b>核心释义：</b>本期工资变更、考勤及补贴等信息提交并计入本次工资核算的截止时间。</p><p><b>职场英文例句：</b>Changes submitted after the payroll cutoff date go into the next cycle.</p><p><b>中文翻译：</b>薪资变更如在核算截止日期之后提交，将进入下一个工资周期。</p><p><b>高频短语：</b>meet the payroll cutoff date · 达到薪资核算截止日</p></details><details><summary>Leave balance — 剩余休假额度／假期余额</summary><p><b>核心释义：</b>员工在系统中可使用的年假或其他假别剩余额度。</p><p><b>职场英文例句：</b>Employees can check their leave balance in self-service.</p><p><b>中文翻译：</b>员工可以在自助服务系统中查看剩余假期。</p><p><b>高频短语：</b>check leave balance · 核查剩余休假额度</p></details><details><summary>Leave accrual — 假期累积／年假累计</summary><p><b>核心释义：</b>员工根据服务时间或制度逐步获得休假额度的计算过程。</p><p><b>职场英文例句：</b>Annual leave accrual is calculated monthly under the policy.</p><p><b>中文翻译：</b>根据政策，年假按月累计。</p><p><b>高频短语：</b>calculate leave accrual · 计算假期累积</p></details><details><summary>Unpaid leave — 无薪假／不带薪休假</summary><p><b>核心释义：</b>员工经批准暂停工作、且相应期间不领取工资的休假安排。</p><p><b>职场英文例句：</b>The employee requested two weeks of unpaid leave.</p><p><b>中文翻译：</b>该员工申请了两周无薪假。</p><p><b>高频短语：</b>apply for unpaid leave · 应用无薪假</p></details><details><summary>Offboarding checklist — 离职手续清单</summary><p><b>核心释义：</b>HR、IT 和用人部门用于确保离职交接及资产归还完成的清单。</p><p><b>职场英文例句：</b>The offboarding checklist includes system access removal.</p><p><b>中文翻译：</b>离职清单包括取消系统访问权限。</p><p><b>高频短语：</b>complete the offboarding checklist · 完成离职手续清单</p></details><details><summary>Headcount reconciliation — 人员编制核对</summary><p><b>核心释义：</b>将人事系统在职人数、批准编制和财务数据进行对账的流程。</p><p><b>职场英文例句：</b>We conduct headcount reconciliation before monthly reporting.</p><p><b>中文翻译：</b>我们在每月报表前核对员工人数及编制。</p><p><b>高频短语：</b>perform headcount reconciliation · 开展人员编制核对</p></details><details><summary>Employment verification — 在职／任职信息证明核验</summary><p><b>核心释义：</b>由 HR 按规定核实员工任职状态、岗位及任职时间等信息的服务。</p><p><b>职场英文例句：</b>The bank requested employment verification with the employee&#x27;s authorization.</p><p><b>中文翻译：</b>在获得员工授权后，银行要求提供在职证明。</p><p><b>高频短语：</b>provide employment verification · 提供在职</p></details><details><summary>Personnel action — 人事异动／人事操作单</summary><p><b>核心释义：</b>记录入职、转岗、调薪、晋升、离职等人事变更的系统操作或审批动作。</p><p><b>职场英文例句：</b>HR submitted a personnel action for the employee&#x27;s transfer.</p><p><b>中文翻译：</b>人力资源部门已提交该员工的调岗人事变动单。</p><p><b>高频短语：</b>submit a personnel action · 提交人事异动</p></details><details><summary>HR compliance audit — 人力资源合规审计</summary><p><b>核心释义：</b>对劳动用工、员工记录、权限或政策执行的合规性进行系统核查。</p><p><b>职场英文例句：</b>The HR compliance audit identified gaps in record retention.</p><p><b>中文翻译：</b>人力资源合规审计发现档案留存方面存在不足。</p><p><b>高频短语：</b>conduct an HR compliance audit · 开展人力资源合规审计</p></details></details><details class="fallback-module"><summary><b>海外派遣与全球流动</b> · 53条</summary><details><summary>Global mobility — 全球人才流动</summary><p><b>核心释义：</b>跨国家或地区安排员工工作及发展的管理实践。</p><p><b>职场英文例句：</b>Our global mobility policy covers international assignments.</p><p><b>中文翻译：</b>我们的全球人才流动政策涵盖国际派遣。</p><p><b>高频短语：</b>global mobility program · 全球人才流动计划</p></details><details><summary>International assignment — 国际派遣</summary><p><b>核心释义：</b>员工因业务需要赴另一国家或地区工作一段时间。</p><p><b>职场英文例句：</b>The international assignment will last eighteen months.</p><p><b>中文翻译：</b>此次国际派遣将持续18个月。</p><p><b>高频短语：</b>long-term international assignment · 长期国际派遣</p></details><details><summary>Expatriate — 外派员工</summary><p><b>核心释义：</b>在非本国或非通常居住地国家工作的员工。</p><p><b>职场英文例句：</b>The expatriate will receive relocation support.</p><p><b>中文翻译：</b>该外派员工将获得搬迁支持。</p><p><b>高频短语：</b>expatriate employee · 海外派遣员工</p></details><details><summary>Host country — 东道国</summary><p><b>核心释义：</b>员工被派往工作的国家。</p><p><b>职场英文例句：</b>The host country HR team will support local onboarding.</p><p><b>中文翻译：</b>东道国人力资源团队将协助完成当地入职手续。</p><p><b>高频短语：</b>host-country requirements · 派驻国合规要求</p></details><details><summary>Home country — 派出国</summary><p><b>核心释义：</b>员工原所在的国家或工作所在地。</p><p><b>职场英文例句：</b>The home country team will retain the employee&#x27;s personnel file.</p><p><b>中文翻译：</b>派出国团队将继续保管该员工的人事档案。</p><p><b>高频短语：</b>home-country payroll · 派出国薪资发放</p></details><details><summary>Assignment letter — 派遣函</summary><p><b>核心释义：</b>说明派遣期限、待遇及相关条件的文件。</p><p><b>职场英文例句：</b>HR is preparing the assignment letter for approval.</p><p><b>中文翻译：</b>人力资源部门正在准备外派任命函，以供审批。</p><p><b>高频短语：</b>international assignment letter · 国际派遣函</p></details><details><summary>Assignment allowance — 派遣津贴</summary><p><b>核心释义：</b>与跨境派遣相关的额外补贴。</p><p><b>职场英文例句：</b>The assignment allowance is outlined in the mobility policy.</p><p><b>中文翻译：</b>外派津贴的具体规定载于全球流动政策。</p><p><b>高频短语：</b>assignment allowance policy · 派遣津贴政策</p></details><details><summary>Cost-of-living allowance (COLA) — 生活成本补贴</summary><p><b>核心释义：</b>为弥补派驻地生活成本差异提供的补贴。</p><p><b>职场英文例句：</b>A cost-of-living allowance may apply to the host location.</p><p><b>中文翻译：</b>东道国工作地点可能适用生活成本津贴。</p><p><b>高频短语：</b>calculate the cost-of-living allowance · 计算生活成本津贴</p></details><details><summary>Housing allowance — 住房津贴</summary><p><b>核心释义：</b>补助员工在派驻地的住房支出。</p><p><b>职场英文例句：</b>The housing allowance is subject to the approved cap.</p><p><b>中文翻译：</b>住房津贴须遵守已批准的金额上限。</p><p><b>高频短语：</b>monthly housing allowance · 每月住房津贴</p></details><details><summary>Relocation assistance — 搬迁支持</summary><p><b>核心释义：</b>帮助员工搬迁、安家和适应新地点的服务。</p><p><b>职场英文例句：</b>Relocation assistance includes shipment and temporary housing.</p><p><b>中文翻译：</b>搬迁支持包括行李运输和临时住宿。</p><p><b>高频短语：</b>relocation assistance package · 搬迁支持方案</p></details><details><summary>Work permit — 工作许可</summary><p><b>核心释义：</b>允许外籍人员在特定国家合法工作的许可。</p><p><b>职场英文例句：</b>The employee must obtain a work permit before starting work.</p><p><b>中文翻译：</b>员工须在开始工作前取得工作许可。</p><p><b>高频短语：</b>apply for a work permit · 应用工作许可</p></details><details><summary>Employment visa — 工作签证</summary><p><b>核心释义：</b>用于工作目的入境或居留的相关签证。</p><p><b>职场英文例句：</b>The employment visa application requires supporting documents.</p><p><b>中文翻译：</b>工作签证申请需要提交证明材料。</p><p><b>高频短语：</b>employment visa application · 工作签证申请</p></details><details><summary>Immigration compliance — 移民事务合规</summary><p><b>核心释义：</b>确保签证、工作许可和居留要求得到遵守。</p><p><b>职场英文例句：</b>Immigration compliance must be checked before travel.</p><p><b>中文翻译：</b>出行前必须核查移民法规合规性。</p><p><b>高频短语：</b>immigration compliance review · 移民事务合规审查</p></details><details><summary>Tax equalization — 税负平衡</summary><p><b>核心释义：</b>通过公司政策使外派员工税负接近假定留在本国的水平。</p><p><b>职场英文例句：</b>Tax equalization is explained in the assignment policy.</p><p><b>中文翻译：</b>税负平衡安排在外派政策中作了说明。</p><p><b>高频短语：</b>tax equalization policy · 税负平衡政策</p></details><details><summary>Hypothetical tax — 假设税</summary><p><b>核心释义：</b>税负平衡政策中按假定本国收入计算的税额。</p><p><b>职场英文例句：</b>The hypothetical tax is deducted under the tax equalization arrangement.</p><p><b>中文翻译：</b>在税负平衡安排下，将扣除假设税款。</p><p><b>高频短语：</b>hypothetical tax calculation · 假设税额计算</p></details><details><summary>Tax protection — 税负保护</summary><p><b>核心释义：</b>按政策保护员工不因派遣承担超出某基准的税负。</p><p><b>职场英文例句：</b>Tax protection may apply when the host-country tax is higher.</p><p><b>中文翻译：</b>如果东道国税负较高，可能适用税务保护安排。</p><p><b>高频短语：</b>tax protection arrangement · 税负保护安排</p></details><details><summary>Tax residency — 税收居民身份</summary><p><b>核心释义：</b>依据当地税法判断的纳税居民状态。</p><p><b>职场英文例句：</b>Tax residency must be assessed for both locations.</p><p><b>中文翻译：</b>必须评估员工在派出地与东道国的税务居民身份。</p><p><b>高频短语：</b>determine tax residency · 确定税收居民身份</p></details><details><summary>Permanent establishment (PE) — 常设机构</summary><p><b>核心释义：</b>跨境经营中可能触发企业所得税义务的固定营业场所等安排。</p><p><b>职场英文例句：</b>We need to assess permanent establishment risk before approving the role.</p><p><b>中文翻译：</b>在批准该岗位前，我们需要评估常设机构（PE）税务风险。</p><p><b>高频短语：</b>permanent establishment risk · 常设机构风险</p></details><details><summary>Social security coverage — 社会保障覆盖</summary><p><b>核心释义：</b>员工在相关地区适用社会保险的安排。</p><p><b>职场英文例句：</b>Social security coverage depends on local rules and agreements.</p><p><b>中文翻译：</b>社会保险覆盖范围取决于当地法规和双边协议。</p><p><b>高频短语：</b>cross-border social security coverage · 跨境社保覆盖</p></details><details><summary>Certificate of coverage — 社保参保证明</summary><p><b>核心释义：</b>用于证明适用社会保障体系的官方文件，视协定而定。</p><p><b>职场英文例句：</b>A certificate of coverage may help avoid duplicate contributions.</p><p><b>中文翻译：</b>社会保险参保证明可能有助于避免重复缴费。</p><p><b>高频短语：</b>request a certificate of coverage · 申请社保参保证明</p></details><details><summary>Split payroll — 分国薪资发放</summary><p><b>核心释义：</b>在两个国家或地区安排发薪的方式。</p><p><b>职场英文例句：</b>Split payroll requires coordination between the two payroll teams.</p><p><b>中文翻译：</b>拆分发薪需要两地薪资团队协同。</p><p><b>高频短语：</b>split payroll arrangement · 分国薪资发放安排</p></details><details><summary>Shadow payroll — 影子薪资核算（跨境税务申报用途）</summary><p><b>核心释义：</b>跨境派遣中，在某一国家/地区为满足税务或社保要求进行并行工资记录和申报，但未必实际支付第二份工资。</p><p><b>职场英文例句：</b>Shadow payroll may be required for local reporting obligations.</p><p><b>中文翻译：</b>为了履行当地申报义务，可能需要执行影子薪资核算。</p><p><b>高频短语：</b>shadow payroll reporting · 影子薪资核算申报</p></details><details><summary>Balance sheet approach — 平衡表法</summary><p><b>核心释义：</b>参考员工本国支出结构设计外派薪酬的方式。</p><p><b>职场英文例句：</b>The balance sheet approach aims to maintain purchasing power.</p><p><b>中文翻译：</b>资产负债表法旨在维持外派员工的购买力。</p><p><b>高频短语：</b>balance sheet approach to expatriate pay · 外派薪酬平衡表法</p></details><details><summary>Localization — 待遇本地化</summary><p><b>核心释义：</b>由外派待遇转为当地雇佣及薪酬体系的过程。</p><p><b>职场英文例句：</b>Localization may be considered after the assignment ends.</p><p><b>中文翻译：</b>外派结束后，可以考虑将员工转为当地雇佣。</p><p><b>高频短语：</b>localization of expatriate terms · 外派待遇本地化</p></details><details><summary>Local-plus package — 本地薪酬加补贴方案</summary><p><b>核心释义：</b>以当地薪酬为基础追加部分国际派遣福利。</p><p><b>职场英文例句：</b>A local-plus package includes a local salary and selected allowances.</p><p><b>中文翻译：</b>本地增强型薪酬方案包含当地薪资和部分额外津贴。</p><p><b>高频短语：</b>local-plus compensation · 本地薪酬加补贴方案</p></details><details><summary>Repatriation — 回任</summary><p><b>核心释义：</b>派遣结束后员工返回原工作国家或组织的过程。</p><p><b>职场英文例句：</b>Repatriation planning should begin before the assignment ends.</p><p><b>中文翻译：</b>回任规划应在外派结束前启动。</p><p><b>高频短语：</b>repatriation plan · 回任计划</p></details><details><summary>Reintegration — 回任融入</summary><p><b>核心释义：</b>帮助结束派遣的员工重新适应原组织和岗位。</p><p><b>职场英文例句：</b>Reintegration support can improve post-assignment retention.</p><p><b>中文翻译：</b>回任融入支持可以改善外派结束后的员工留存情况。</p><p><b>高频短语：</b>reintegration program · 回任融入计划</p></details><details><summary>Assignment extension — 派遣延期</summary><p><b>核心释义：</b>延长原定国际派遣期限的安排。</p><p><b>职场英文例句：</b>The business requested an assignment extension of six months.</p><p><b>中文翻译：</b>业务部门申请将外派期限延长六个月。</p><p><b>高频短语：</b>approve an assignment extension · 审批派遣延期</p></details><details><summary>Assignment termination — 派遣终止</summary><p><b>核心释义：</b>根据约定或特殊原因提前结束派遣。</p><p><b>职场英文例句：</b>Early assignment termination requires a clear transition plan.</p><p><b>中文翻译：</b>提前结束外派需要明确的交接过渡计划。</p><p><b>高频短语：</b>early assignment termination · 提前终止派遣</p></details><details><summary>Dependent support — 随行家属支持</summary><p><b>核心释义：</b>为派遣员工配偶和子女提供的安置或适应服务。</p><p><b>职场英文例句：</b>Dependent support may include school search assistance.</p><p><b>中文翻译：</b>家属支持可能包括协助寻找学校。</p><p><b>高频短语：</b>dependent relocation support · 随行家属搬迁支持</p></details><details><summary>Destination services — 目的地安置服务</summary><p><b>核心释义：</b>协助员工抵达派驻地后安家。</p><p><b>职场英文例句：</b>Destination services can help with housing and local registration.</p><p><b>中文翻译：</b>目的地安置服务可协助解决住房及当地登记事项。</p><p><b>高频短语：</b>destination services provider · 目的地安置服务商</p></details><details><summary>Hardship allowance — 艰苦地区津贴</summary><p><b>核心释义：</b>因派驻地生活或工作条件特殊提供的补贴。</p><p><b>职场英文例句：</b>The hardship allowance is reviewed using location assessments.</p><p><b>中文翻译：</b>艰苦地区津贴会根据驻地评估结果进行审查。</p><p><b>高频短语：</b>hardship allowance eligibility · 艰苦地区津贴领取资格</p></details><details><summary>Foreign exchange risk — 汇率风险</summary><p><b>核心释义：</b>汇率变动对薪资、预算或员工购买力的影响。</p><p><b>职场英文例句：</b>Foreign exchange risk affects the assignment cost estimate.</p><p><b>中文翻译：</b>外汇风险会影响外派成本估算。</p><p><b>高频短语：</b>manage foreign exchange risk · 管理汇率风险</p></details><details><summary>Assignment cost projection — 派遣成本预测</summary><p><b>核心释义：</b>估算外派期间薪酬、税费和支持费用的预算。</p><p><b>职场英文例句：</b>The assignment cost projection includes housing and tax support.</p><p><b>中文翻译：</b>外派成本预测包括住房和税务支持费用。</p><p><b>高频短语：</b>prepare an assignment cost projection · 准备派遣成本预测</p></details><details><summary>Mobility policy exception — 派遣政策例外</summary><p><b>核心释义：</b>对标准派遣政策作出的特殊批准。</p><p><b>职场英文例句：</b>Any mobility policy exception must be documented and approved.</p><p><b>中文翻译：</b>任何全球人才流动政策例外都必须记录并获得审批。</p><p><b>高频短语：</b>request a mobility policy exception · 申请派遣政策例外</p></details><details><summary>Cross-border remote work — 跨境远程办公</summary><p><b>核心释义：</b>员工从雇佣主体所在国以外远程工作。</p><p><b>职场英文例句：</b>Cross-border remote work can create tax and immigration issues.</p><p><b>中文翻译：</b>跨境远程办公可能引发税务和移民合规问题。</p><p><b>高频短语：</b>cross-border remote work request · 跨境远程办公申请</p></details><details><summary>Business traveler — 商务出差人员</summary><p><b>核心释义：</b>因短期商务活动跨境出行的员工。</p><p><b>职场英文例句：</b>Business traveler tracking helps manage compliance obligations.</p><p><b>中文翻译：</b>追踪商务出差人员有助于管理合规义务。</p><p><b>高频短语：</b>business traveler tracking · 商务出差人员追踪</p></details><details><summary>Duty of care — 雇主关怀与保护责任</summary><p><b>核心释义：</b>组织对员工安全与健康风险承担的适当责任。</p><p><b>职场英文例句：</b>Our duty of care framework covers emergency support abroad.</p><p><b>中文翻译：</b>我们的员工安全照护框架涵盖海外紧急支援。</p><p><b>高频短语：</b>duty of care obligation · 雇主照护义务</p></details><details><summary>Emergency evacuation — 紧急撤离</summary><p><b>核心释义：</b>发生安全风险时协助人员撤离的安排。</p><p><b>职场英文例句：</b>The emergency evacuation plan includes a 24-hour contact line.</p><p><b>中文翻译：</b>紧急撤离计划包含24小时联系电话。</p><p><b>高频短语：</b>emergency evacuation protocol · 紧急撤离程序</p></details><details><summary>Assignment ROI — 派遣投资回报</summary><p><b>核心释义：</b>评估外派成本与业务及人才收益的关系。</p><p><b>职场英文例句：</b>Assignment ROI should consider both business impact and talent growth.</p><p><b>中文翻译：</b>评估外派投资回报时，应同时考虑业务成效和人才成长。</p><p><b>高频短语：</b>measure assignment ROI · 衡量派遣投资回报</p></details><details><summary>Assignee — 国际派遣员工／被派遣人员</summary><p><b>核心释义：</b>根据公司派遣政策被安排到其他国家或地区工作一段时间的员工。</p><p><b>职场英文例句：</b>The assignee will relocate to Singapore next month.</p><p><b>中文翻译：</b>该外派员工将于下个月搬迁至新加坡。</p><p><b>高频短语：</b>support an assignee · 支持国际派遣员工</p></details><details><summary>Secondment — 借调／临时派驻</summary><p><b>核心释义：</b>员工在保持特定雇佣关系安排下，被临时派往关联企业或其他组织工作。</p><p><b>职场英文例句：</b>The secondment agreement defines the employee&#x27;s reporting line.</p><p><b>中文翻译：</b>借调协议规定了该员工的汇报关系。</p><p><b>高频短语：</b>secondment agreement · 借调协议</p></details><details><summary>Short-term assignment — 短期国际派遣</summary><p><b>核心释义：</b>按组织政策定义，通常为数月等较短期间的跨境工作派遣。</p><p><b>职场英文例句：</b>The short-term assignment requires a work permit.</p><p><b>中文翻译：</b>短期派遣需要取得工作许可。</p><p><b>高频短语：</b>arrange a short-term assignment · 安排短期国际派遣</p></details><details><summary>Long-term assignment — 长期国际派遣</summary><p><b>核心释义：</b>按组织全球流动政策定义、覆盖较长期间的跨境工作派遣。</p><p><b>职场英文例句：</b>The long-term assignment package includes housing support.</p><p><b>中文翻译：</b>长期派遣薪酬福利方案包括住房支持。</p><p><b>高频短语：</b>approve a long-term assignment · 审批长期国际派遣</p></details><details><summary>International transfer — 跨国岗位调动</summary><p><b>核心释义：</b>员工工作地点或雇佣主体在不同国家之间发生转移的安排。</p><p><b>职场英文例句：</b>HR reviewed the employment terms for the international transfer.</p><p><b>中文翻译：</b>人力资源部门审查了该员工跨国调动的雇佣条款。</p><p><b>高频短语：</b>manage an international transfer · 管理跨国岗位调动</p></details><details><summary>Host-country payroll — 派驻国薪资核算／发薪</summary><p><b>核心释义：</b>国际派遣人员在工作所在地执行的工资计算、支付和申报流程。</p><p><b>职场英文例句：</b>The host-country payroll team will confirm local tax withholding.</p><p><b>中文翻译：</b>东道国薪资团队将核实当地的预扣税款。</p><p><b>高频短语：</b>process host-country payroll · 处理派驻国薪资核算</p></details><details><summary>Home leave — 外派探亲假／回国探亲假</summary><p><b>核心释义：</b>根据外派政策向派遣员工及符合条件的家属提供的回原籍地探亲休假。</p><p><b>职场英文例句：</b>The assignee is eligible for one home leave trip each year.</p><p><b>中文翻译：</b>该外派员工每年有资格享受一次探亲假旅行。</p><p><b>高频短语：</b>home leave entitlement · 外派探亲假权益</p></details><details><summary>Dependent visa — 随行家属签证</summary><p><b>核心释义：</b>为符合当地移民规定的派遣员工家属申请的居留或陪同类签证。</p><p><b>职场英文例句：</b>The mobility team will assist with the dependent visa application.</p><p><b>中文翻译：</b>国际流动团队将协助办理家属签证。</p><p><b>高频短语：</b>apply for a dependent visa · 应用随行家属签证</p></details><details><summary>Immigration sponsorship — 工作签证／移民担保支持</summary><p><b>核心释义：</b>雇主为员工办理海外工作签证或工作许可提供的担保与办理支持。</p><p><b>职场英文例句：</b>The host entity confirmed that immigration sponsorship is available.</p><p><b>中文翻译：</b>接收单位已确认可以提供移民签证担保。</p><p><b>高频短语：</b>provide immigration sponsorship · 提供工作签证</p></details><details><summary>Relocation reimbursement — 搬迁费用报销</summary><p><b>核心释义：</b>员工因获批工作地点变更发生的符合政策的搬家、交通等费用报销。</p><p><b>职场英文例句：</b>Relocation reimbursement requires receipts and prior approval.</p><p><b>中文翻译：</b>搬迁费用报销需要提供收据并事先获得批准。</p><p><b>高频短语：</b>claim relocation reimbursement · 申请搬迁费用报销</p></details><details><summary>Cross-border tax compliance — 跨境个人所得税合规</summary><p><b>核心释义：</b>对跨境派遣、短期出差等涉及的多法域个人税务义务进行合规管理。</p><p><b>职场英文例句：</b>Cross-border tax compliance must be assessed before deployment.</p><p><b>中文翻译：</b>跨境税务合规问题必须在派遣开始前评估。</p><p><b>高频短语：</b>review cross-border tax compliance · 审阅跨境个人所得税合规</p></details><details><summary>Tax gross-up — 税负补偿／税款加算</summary><p><b>核心释义：</b>雇主为保证员工约定税后收益，在支付中增加金额以覆盖相关税负的计算方式。</p><p><b>职场英文例句：</b>The assignment package includes a tax gross-up for certain allowances.</p><p><b>中文翻译：</b>外派方案对部分津贴提供税款补足安排。</p><p><b>高频短语：</b>calculate a tax gross-up · 计算税负补偿</p></details><details><summary>Repatriation support — 外派结束回任支持</summary><p><b>核心释义：</b>员工海外派遣结束后在岗位安排、搬迁和重新融入方面获得的支持。</p><p><b>职场英文例句：</b>Repatriation support begins before the assignment ends.</p><p><b>中文翻译：</b>外派结束前就会启动回任支持。</p><p><b>高频短语：</b>plan repatriation support · 规划外派结束回任支持</p></details></details><details class="fallback-module"><summary><b>HR商务沟通与汇报</b> · 53条</summary><details><summary>Stakeholder alignment — 利益相关方对齐</summary><p><b>核心释义：</b>就目标、方案和责任达成共同理解。</p><p><b>职场英文例句：</b>We need stakeholder alignment before launching the new policy.</p><p><b>中文翻译：</b>在推出新政策之前，我们需要与利益相关方达成一致。</p><p><b>高频短语：</b>secure stakeholder alignment · 取得利益相关方对齐</p></details><details><summary>Executive summary — 经营层／管理层摘要</summary><p><b>核心释义：</b>在汇报中简述关键发现、影响、风险和需要管理层决策的要点。</p><p><b>职场英文例句：</b>The executive summary highlights decisions and key risks.</p><p><b>中文翻译：</b>执行摘要突出了需要决策的事项和主要风险。</p><p><b>高频短语：</b>prepare an executive summary · 准备经营层</p></details><details><summary>Key takeaway — 核心结论</summary><p><b>核心释义：</b>汇报或分析中最重要的信息。</p><p><b>职场英文例句：</b>The key takeaway is that retention improved in critical roles.</p><p><b>中文翻译：</b>最重要的结论是，关键岗位的员工留存情况有所改善。</p><p><b>高频短语：</b>highlight the key takeaway · 强调核心结论</p></details><details><summary>Action item — 待办行动项</summary><p><b>核心释义：</b>会议后需要落实的具体任务。</p><p><b>职场英文例句：</b>Each action item has an owner and a deadline.</p><p><b>中文翻译：</b>每项待办事项都有负责人和截止日期。</p><p><b>高频短语：</b>track action items · 跟踪待办行动项</p></details><details><summary>Next steps — 下一步安排</summary><p><b>核心释义：</b>明确后续工作和时间节点。</p><p><b>职场英文例句：</b>Let&#x27;s summarize the next steps before we close the meeting.</p><p><b>中文翻译：</b>会议结束前，我们来总结一下下一步行动。</p><p><b>高频短语：</b>agree on next steps · 就下一步安排达成共识</p></details><details><summary>Decision log — 决策记录</summary><p><b>核心释义：</b>追踪已作决定、依据和责任人的文档。</p><p><b>职场英文例句：</b>The decision log records why we selected this option.</p><p><b>中文翻译：</b>决策记录说明了我们选择这一方案的原因。</p><p><b>高频短语：</b>maintain a decision log · 保持决策记录</p></details><details><summary>Meeting minutes — 会议纪要</summary><p><b>核心释义：</b>会议讨论、决定和任务的书面记录。</p><p><b>职场英文例句：</b>I&#x27;ll circulate the meeting minutes after the call.</p><p><b>中文翻译：</b>通话结束后，我会发送会议纪要。</p><p><b>高频短语：</b>circulate meeting minutes · 传阅会议纪要</p></details><details><summary>Escalation path — 升级处理路径</summary><p><b>核心释义：</b>问题无法在当前层级解决时的上报流程。</p><p><b>职场英文例句：</b>The escalation path is documented in the service guide.</p><p><b>中文翻译：</b>升级处理路径已记录在服务指南中。</p><p><b>高频短语：</b>follow the escalation path · 跟进升级处理路径</p></details><details><summary>Business case — 商业论证</summary><p><b>核心释义：</b>说明方案收益、成本、风险与必要性的材料。</p><p><b>职场英文例句：</b>The business case supports additional investment in hiring.</p><p><b>中文翻译：</b>商业论证支持增加招聘投入。</p><p><b>高频短语：</b>build a business case · 建立商业论证</p></details><details><summary>Trade-off — 权衡取舍</summary><p><b>核心释义：</b>在相互冲突的目标或资源限制下作出的选择。</p><p><b>职场英文例句：</b>We discussed the trade-off between speed and cost.</p><p><b>中文翻译：</b>我们讨论了速度与成本之间需要作出的权衡。</p><p><b>高频短语：</b>assess the trade-offs · 评估权衡取舍</p></details><details><summary>Risk mitigation — 风险缓解</summary><p><b>核心释义：</b>降低风险发生概率或影响的措施。</p><p><b>职场英文例句：</b>Risk mitigation measures include extra compliance checks.</p><p><b>中文翻译：</b>风险缓解措施包括增加合规检查。</p><p><b>高频短语：</b>risk mitigation plan · 风险缓解计划</p></details><details><summary>Assumption — 关键假设</summary><p><b>核心释义：</b>分析或预算中暂时成立的前提条件。</p><p><b>职场英文例句：</b>The forecast assumes a stable monthly turnover rate.</p><p><b>中文翻译：</b>该预测假设月度员工离职率保持稳定。</p><p><b>高频短语：</b>validate an assumption · 验证关键假设</p></details><details><summary>Dependency — 依赖事项</summary><p><b>核心释义：</b>某项工作完成需要先满足的条件。</p><p><b>职场英文例句：</b>System integration is a key dependency for the launch.</p><p><b>中文翻译：</b>系统集成是项目上线的一项关键前置依赖。</p><p><b>高频短语：</b>manage dependencies · 管理依赖事项</p></details><details><summary>Timeline — 时间计划</summary><p><b>核心释义：</b>项目重要活动与日期的安排。</p><p><b>职场英文例句：</b>The timeline includes policy drafting and manager training.</p><p><b>中文翻译：</b>项目时间表包括政策起草和管理者培训。</p><p><b>高频短语：</b>confirm the project timeline · 确认时间计划</p></details><details><summary>Milestone — 里程碑</summary><p><b>核心释义：</b>标识项目阶段完成的关键节点。</p><p><b>职场英文例句：</b>The next milestone is executive approval of the policy.</p><p><b>中文翻译：</b>下一个里程碑是获得管理层对政策的批准。</p><p><b>高频短语：</b>hit a milestone · 达成阶段性里程碑</p></details><details><summary>Deliverable — 交付成果</summary><p><b>核心释义：</b>项目需在约定节点提交的具体产出。</p><p><b>职场英文例句：</b>The revised policy handbook is our final deliverable.</p><p><b>中文翻译：</b>修订后的政策手册是我们的最终交付物。</p><p><b>高频短语：</b>project deliverables · 项目交付成果</p></details><details><summary>Scope — 工作范围</summary><p><b>核心释义：</b>项目或流程涵盖与不涵盖的内容。</p><p><b>职场英文例句：</b>The scope includes HR operations in five markets.</p><p><b>中文翻译：</b>本次工作范围包括五个市场的人力资源运营。</p><p><b>高频短语：</b>define the project scope · 制定工作范围</p></details><details><summary>Out of scope — 范围之外</summary><p><b>核心释义：</b>不包含在当前项目或任务内的内容。</p><p><b>职场英文例句：</b>Payroll system replacement is out of scope for phase one.</p><p><b>中文翻译：</b>第一阶段不包括替换薪资系统。</p><p><b>高频短语：</b>out-of-scope request · 超出项目范围的请求</p></details><details><summary>Alignment meeting — 对齐会议</summary><p><b>核心释义：</b>为统一目标、方案与分工召开的会议。</p><p><b>职场英文例句：</b>The alignment meeting will address outstanding questions.</p><p><b>中文翻译：</b>对齐会议将讨论尚未解决的问题。</p><p><b>高频短语：</b>schedule an alignment meeting · 安排对齐会议</p></details><details><summary>Touch base — 简短沟通进展</summary><p><b>核心释义：</b>非正式交流当前状态与下一步。</p><p><b>职场英文例句：</b>Let&#x27;s touch base on the hiring plan tomorrow.</p><p><b>中文翻译：</b>明天我们再简短沟通一下招聘计划。</p><p><b>高频短语：</b>touch base with someone · 与某人简短沟通进展</p></details><details><summary>Follow up — 跟进</summary><p><b>核心释义：</b>就上一轮沟通继续确认或推进。</p><p><b>职场英文例句：</b>I&#x27;ll follow up with legal about the contract wording.</p><p><b>中文翻译：</b>我会向法务跟进合同措辞。</p><p><b>高频短语：</b>follow up on an issue · 跟进某项议题</p></details><details><summary>Circle back — 稍后再讨论</summary><p><b>核心释义：</b>在补充信息或合适时间后回到某问题。</p><p><b>职场英文例句：</b>Let&#x27;s circle back once the budget is confirmed.</p><p><b>中文翻译：</b>预算确定后，我们再回来讨论这个问题。</p><p><b>高频短语：</b>circle back to a topic · 稍后再讨论某个话题</p></details><details><summary>Heads-up — 提前提醒</summary><p><b>核心释义：</b>在事情发生前给相关方一个简短通知。</p><p><b>职场英文例句：</b>Just a heads-up: the survey closes on Friday.</p><p><b>中文翻译：</b>提醒一下：调查将在周五截止。</p><p><b>高频短语：</b>give someone a heads-up · 给予提前提醒</p></details><details><summary>Flag an issue — 提出风险或问题</summary><p><b>核心释义：</b>提醒他人关注可能的障碍。</p><p><b>职场英文例句：</b>I want to flag an issue with the assignment timeline.</p><p><b>中文翻译：</b>我想提醒大家关注外派时间安排上的一个问题。</p><p><b>高频短语：</b>flag a potential risk · 提示潜在风险</p></details><details><summary>On the same page — 达成共识</summary><p><b>核心释义：</b>对信息和预期有一致理解。</p><p><b>职场英文例句：</b>Let&#x27;s make sure we are on the same page about the criteria.</p><p><b>中文翻译：</b>我们要确保对相关标准的理解保持一致。</p><p><b>高频短语：</b>get on the same page · 达成共识</p></details><details><summary>Deep dive — 深入分析</summary><p><b>核心释义：</b>针对某个问题进行细致讨论或研究。</p><p><b>职场英文例句：</b>We will do a deep dive into the attrition data next week.</p><p><b>中文翻译：</b>下周我们将深入分析员工流失数据。</p><p><b>高频短语：</b>deep dive into the data · 深入分析数据</p></details><details><summary>High-level overview — 概览</summary><p><b>核心释义：</b>不展开具体细节的整体介绍。</p><p><b>职场英文例句：</b>I&#x27;ll start with a high-level overview of the talent strategy.</p><p><b>中文翻译：</b>我先简要介绍一下人才战略的整体情况。</p><p><b>高频短语：</b>provide a high-level overview · 提供概览</p></details><details><summary>Bottom line — 最终结论</summary><p><b>核心释义：</b>归纳后最重要的判断或结果。</p><p><b>职场英文例句：</b>The bottom line is that the program needs a larger budget.</p><p><b>中文翻译：</b>归根结底，这个项目需要更多预算。</p><p><b>高频短语：</b>get to the bottom line · 直奔最终结论</p></details><details><summary>Data point — 数据点</summary><p><b>核心释义：</b>用于支持论点的一项具体数据。</p><p><b>职场英文例句：</b>One data point alone is not enough to explain turnover.</p><p><b>中文翻译：</b>仅凭一个数据点不足以解释员工流失情况。</p><p><b>高频短语：</b>support with data points · 支持数据点</p></details><details><summary>Insight — 洞察</summary><p><b>核心释义：</b>从分析中提炼出的有行动价值的理解。</p><p><b>职场英文例句：</b>The survey insight suggests a need for better manager feedback.</p><p><b>中文翻译：</b>调查结果表明，需要改善管理者的反馈质量。</p><p><b>高频短语：</b>actionable insight · 可付诸行动的洞察</p></details><details><summary>Root cause — 根本原因</summary><p><b>核心释义：</b>导致问题发生的基础性因素。</p><p><b>职场英文例句：</b>We should investigate the root cause before changing the policy.</p><p><b>中文翻译：</b>调整政策前，我们应该先调查根本原因。</p><p><b>高频短语：</b>root cause analysis · 根本原因分析</p></details><details><summary>Recommendation — 建议方案</summary><p><b>核心释义：</b>基于评估提出的具体行动方向。</p><p><b>职场英文例句：</b>My recommendation is to pilot the policy in two markets.</p><p><b>中文翻译：</b>我的建议是先在两个市场试点这项政策。</p><p><b>高频短语：</b>make a recommendation · 作出建议方案</p></details><details><summary>Approval workflow — 审批流程</summary><p><b>核心释义：</b>规范审批节点、角色和条件的工作流。</p><p><b>职场英文例句：</b>The approval workflow involves HR, finance and legal.</p><p><b>中文翻译：</b>审批流程涉及人力资源、财务和法务部门。</p><p><b>高频短语：</b>streamline the approval workflow · 简化审批流程</p></details><details><summary>Sign-off — 正式审批确认／签批</summary><p><b>核心释义：</b>由授权负责人对文件、预算或方案作出最后批准或签字确认。</p><p><b>职场英文例句：</b>We need legal sign-off before sending the announcement.</p><p><b>中文翻译：</b>发送公告前，我们需要法务签字确认。</p><p><b>高频短语：</b>obtain final sign-off · 获取正式审批确认</p></details><details><summary>Rollout plan — 推行计划</summary><p><b>核心释义：</b>新政策或项目上线的沟通与执行安排。</p><p><b>职场英文例句：</b>The rollout plan includes training for managers.</p><p><b>中文翻译：</b>推广计划包括面向管理者的培训。</p><p><b>高频短语：</b>phased rollout plan · 分阶段推行计划</p></details><details><summary>Pilot program — 试点项目</summary><p><b>核心释义：</b>先在小范围验证方案效果的项目。</p><p><b>职场英文例句：</b>The pilot program will run in two offices for eight weeks.</p><p><b>中文翻译：</b>试点项目将在两个办公室开展八周。</p><p><b>高频短语：</b>launch a pilot program · 启动试点项目</p></details><details><summary>Lessons learned — 经验复盘</summary><p><b>核心释义：</b>总结项目过程中有效和待改进的做法。</p><p><b>职场英文例句：</b>We captured lessons learned after the policy rollout.</p><p><b>中文翻译：</b>政策推广后，我们总结了经验教训。</p><p><b>高频短语：</b>lessons-learned session · 经验复盘会议</p></details><details><summary>Status update — 进度更新</summary><p><b>核心释义：</b>向相关方说明当前状态与风险的沟通。</p><p><b>职场英文例句：</b>The status update covers progress, risks and blockers.</p><p><b>中文翻译：</b>进展更新涵盖工作进度、风险及阻碍事项。</p><p><b>高频短语：</b>send a status update · 发送进度更新</p></details><details><summary>Blocker — 阻碍事项</summary><p><b>核心释义：</b>影响工作继续推进的关键障碍。</p><p><b>职场英文例句：</b>Data access is the main blocker for this analysis.</p><p><b>中文翻译：</b>数据访问权限是这次分析面临的主要障碍。</p><p><b>高频短语：</b>remove a blocker · 消除阻碍事项</p></details><details><summary>Stakeholder feedback — 利益相关方意见</summary><p><b>核心释义：</b>对方案或成果的建议与评价。</p><p><b>职场英文例句：</b>We incorporated stakeholder feedback into the final draft.</p><p><b>中文翻译：</b>我们已将利益相关方的反馈纳入最终草案。</p><p><b>高频短语：</b>collect stakeholder feedback · 收集利益相关方意见</p></details><details><summary>Policy briefing — 人力资源政策宣讲／说明会</summary><p><b>核心释义：</b>向管理者或员工介绍新 HR 制度内容、实施安排及注意事项的沟通活动。</p><p><b>职场英文例句：</b>HR will hold a policy briefing for line managers.</p><p><b>中文翻译：</b>人力资源部门将为直线经理举办政策说明会。</p><p><b>高频短语：</b>deliver a policy briefing · 开展人力资源政策宣讲</p></details><details><summary>Business justification — 业务必要性说明／业务理由</summary><p><b>核心释义：</b>在招聘、预算或项目审批中说明相关行动为何符合业务需求的材料。</p><p><b>职场英文例句：</b>The headcount request must include a clear business justification.</p><p><b>中文翻译：</b>人员编制申请必须包含清晰的业务必要性说明。</p><p><b>高频短语：</b>provide a business justification · 提供业务必要性说明</p></details><details><summary>Budget sign-off — 预算正式批准／签批</summary><p><b>核心释义：</b>由具备权限的管理者对预算进行最终审核与正式批准。</p><p><b>职场英文例句：</b>We cannot launch the program until budget sign-off is complete.</p><p><b>中文翻译：</b>预算审批完成之前，我们无法启动该项目。</p><p><b>高频短语：</b>obtain budget sign-off · 获取预算正式批准</p></details><details><summary>Approval matrix — 审批权限矩阵</summary><p><b>核心释义：</b>按事项、金额或岗位明确各级审核与批准权限的管理表。</p><p><b>职场英文例句：</b>The approval matrix identifies who signs off on each request.</p><p><b>中文翻译：</b>审批权限矩阵明确了每项申请由谁签字批准。</p><p><b>高频短语：</b>update the approval matrix · 更新审批权限矩阵</p></details><details><summary>Leadership briefing — 管理层专项简报</summary><p><b>核心释义：</b>向经营层或高级管理团队汇报业务进展、风险和决策需求的沟通。</p><p><b>职场英文例句：</b>The CHRO prepared a leadership briefing on workforce risks.</p><p><b>中文翻译：</b>首席人力资源官准备了一份关于人员风险的管理层简报。</p><p><b>高频短语：</b>prepare a leadership briefing · 准备管理层专项简报</p></details><details><summary>Implementation timeline — 实施时间计划／落地时间表</summary><p><b>核心释义：</b>项目或制度推进中按时间排列的阶段任务与关键节点。</p><p><b>职场英文例句：</b>The implementation timeline includes a two-week pilot.</p><p><b>中文翻译：</b>实施时间表包括为期两周的试点。</p><p><b>高频短语：</b>confirm the implementation timeline · 确认实施时间计划</p></details><details><summary>Meeting agenda — 会议议程</summary><p><b>核心释义：</b>列出会议目标、议题、主持人及时间安排的文件。</p><p><b>职场英文例句：</b>Please circulate the meeting agenda before the HR review.</p><p><b>中文翻译：</b>请在人力资源评审会前分发会议议程。</p><p><b>高频短语：</b>share the meeting agenda · 分享会议议程</p></details><details><summary>Decision memo — 决策备忘录／决策建议书</summary><p><b>核心释义：</b>为管理层集中呈现备选方案、证据、风险及建议决策的短文档。</p><p><b>职场英文例句：</b>The decision memo summarizes the proposed policy changes.</p><p><b>中文翻译：</b>决策备忘录汇总了拟议的政策变更。</p><p><b>高频短语：</b>draft a decision memo · 起草决策备忘录</p></details><details><summary>Stakeholder engagement — 相关方沟通与参与</summary><p><b>核心释义：</b>在项目或政策过程中与关键部门和人员持续沟通并争取参与支持。</p><p><b>职场英文例句：</b>Stakeholder engagement is critical during a global policy rollout.</p><p><b>中文翻译：</b>全球政策推广期间，利益相关方参与至关重要。</p><p><b>高频短语：</b>strengthen stakeholder engagement · 加强相关方沟通与参与</p></details><details><summary>Working session — 专题工作会议／协同研讨会</summary><p><b>核心释义：</b>为共同讨论、解决问题或完成具体产出而举行的工作会议。</p><p><b>职场英文例句：</b>Let&#x27;s schedule a working session to finalize the HR process.</p><p><b>中文翻译：</b>我们安排一次工作会议，敲定人力资源流程吧。</p><p><b>高频短语：</b>host a working session · 主持专题工作会议</p></details><details><summary>Compliance update — 合规进展通报／合规要求更新</summary><p><b>核心释义：</b>就法律合规变化、检查发现和整改工作向相关方通报的材料。</p><p><b>职场英文例句：</b>HR shared a compliance update with regional managers.</p><p><b>中文翻译：</b>人力资源部门向区域管理者通报了最新合规动态。</p><p><b>高频短语：</b>send a compliance update · 发送合规进展通报</p></details><details><summary>Follow-up email — 会后跟进邮件</summary><p><b>核心释义：</b>确认会议结论、行动项和责任人并继续推进事项的邮件。</p><p><b>职场英文例句：</b>I will send a follow-up email with the agreed next steps.</p><p><b>中文翻译：</b>我会发送一封后续邮件，列明已商定的下一步行动。</p><p><b>高频短语：</b>send a follow-up email · 发送会后跟进邮件</p></details><details><summary>Revise — 修订（人力资源政策／岗位说明书等）</summary><p><b>核心释义：</b>在 HR 工作中指根据反馈、组织变化或法律要求，对岗位说明书、员工手册、薪酬政策等正式文件作出修改或修订。</p><p><b>职场英文例句：</b>We need to revise the job description before posting the vacancy.</p><p><b>中文翻译：</b>发布岗位招聘信息前，我们需要修订岗位说明书。</p><p><b>高频短语：</b>revise a job description · 修订岗位说明书</p></details></details></div></noscript></body></html>
